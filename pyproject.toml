[project]
name = "transcript-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.1",
    "google-generativeai>=0.8.5",
    "python-dotenv>=1.1.1",
    "uvicorn>=0.35.0",
]

[tool.pytest.ini_options]
addopts = "--ignore-glob=test_*.py"

[project.optional-dependencies]
test = [
    "pytest>=8.4.2",
    "pytest-mock>=3.15.0",
]